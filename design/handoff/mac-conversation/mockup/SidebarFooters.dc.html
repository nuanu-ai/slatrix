<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Низ сайдбара при длинном списке</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0} button{font:inherit}</style>
</helmet>
<div style="width: 1004px; height: 920px; box-sizing: border-box; padding: 32px 40px; background: {{t.board}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; display: flex; gap: 48px">
  <sc-for list="{{variants}}" as="v" hint-placeholder-count="3">
    <div style="width: 276px; flex: none">
      <div style="height: 40px; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 12px; box-sizing: content-box">
        <span style="font-size: 13px; font-weight: 600; color: {{v.labelColor}}">{{v.title}}</span>
        <span style="font-size: 11px; color: {{t.secondary}}; margin-top: 2px">{{v.note}}</span>
      </div>
      <div style="position: relative; width: 276px; height: 800px; background: {{t.canvas}}; border-radius: 12px; overflow: hidden; border: 0.5px solid {{t.border}}">
        <aside style="position: absolute; left: 8px; top: 8px; bottom: 8px; width: 260px; box-sizing: border-box; background: {{t.sidebar}}; border: 0.5px solid {{t.border}}; border-radius: 16px; overflow: hidden; color: {{t.text}}">
          <div style="height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 14px">
            <div style="display: flex; gap: 8px">
              <span style="width: 12px; height: 12px; border-radius: 6px; background: #ff5f57"></span>
              <span style="width: 12px; height: 12px; border-radius: 6px; background: #febc2e"></span>
              <span style="width: 12px; height: 12px; border-radius: 6px; background: #28c840"></span>
            </div>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.secondary}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="3"></rect><path d="M9 4.5v15"></path></svg>
          </div>
          <div style="height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 16px">
            <span style="display: flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 600">Nuanu AI Lab
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{t.secondary}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
            </span>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{t.secondary}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5V12"></path><path d="M17.5 3.5l3 3L12 15l-4 1 1-4z"></path></svg>
          </div>

          <div style="position: absolute; top: 80px; left: 0; right: 0; bottom: 0; overflow: hidden">
            <sc-for list="{{sections}}" as="section" hint-placeholder-count="3">
              <div style="margin-top: 14px">
                <div style="height: 24px; display: flex; align-items: center; padding: 0 16px; font-size: 11px; font-weight: 600; color: {{t.secondary}}">{{section.title}}</div>
                <sc-for list="{{section.rows}}" as="row" hint-placeholder-count="6">
                  <div style="margin: 0 8px; height: 28px; border-radius: 8px; padding: 0 8px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: {{row.weight}}; color: {{row.color}}">
                    <span style="width: 18px; text-align: center; font-size: 15px; font-weight: 500; color: {{t.tertiary}}">#</span>
                    {{row.name}}
                  </div>
                </sc-for>
              </div>
            </sc-for>

            <sc-if value="{{v.clip}}" hint-placeholder-val="{{false}}">
              <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 52px; background: {{t.bar}}; border-top: 0.5px solid {{t.border}}; display: flex; align-items: center; gap: 10px; padding: 0 16px">
                <span style="position: relative; width: 28px; height: 28px; border-radius: 14px; background: {{me.fill}}; color: #ffffff; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{me.initials}}
                  <span style="position: absolute; right: -2px; bottom: -2px; width: 8px; height: 8px; border-radius: 50%; background: #30d158; border: 2px solid {{t.bar}}"></span>
                </span>
                <span style="font-size: 13px">{{me.name}}</span>
              </div>
            </sc-if>

            <sc-if value="{{v.glass}}" hint-placeholder-val="{{false}}">
              <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 68px; background: linear-gradient(to top, {{t.sidebar}} 30%, {{t.sidebarClear}} 60%)"></div>
              <div style="position: absolute; left: 8px; right: 8px; bottom: 8px; height: 52px; box-sizing: border-box; border-radius: 12px; background: {{t.glass}}; -webkit-backdrop-filter: blur(14px) saturate(1.6); backdrop-filter: blur(14px) saturate(1.6); border: 0.5px solid {{t.glassEdge}}; box-shadow: 0 6px 18px {{t.shadow}}, inset 0 0.5px 0 {{t.glassHighlight}}; display: flex; align-items: center; gap: 10px; padding: 0 12px">
                <span style="position: relative; width: 28px; height: 28px; border-radius: 14px; background: {{me.fill}}; color: #ffffff; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{me.initials}}
                  <span style="position: absolute; right: -2px; bottom: -2px; width: 8px; height: 8px; border-radius: 50%; background: #30d158; border: 2px solid {{t.sidebar}}"></span>
                </span>
                <span style="font-size: 13px">{{me.name}}</span>
              </div>
            </sc-if>

            <sc-if value="{{v.fade}}" hint-placeholder-val="{{true}}">
              <div style="position: absolute; left: 0; right: 0; bottom: 44px; height: 36px; background: linear-gradient(to top, {{t.sidebar}}, {{t.sidebarClear}}); pointer-events: none"></div>
              <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 44px; background: {{t.sidebar}}">
                <button style="width: calc(100% - 16px); margin: 0 8px; height: 36px; border: 0; border-radius: 8px; padding: 0 8px; background: transparent; color: {{t.text}}; display: flex; align-items: center; gap: 8px; font-size: 13px; text-align: left">
                  <span style="position: relative; width: 22px; height: 22px; border-radius: 11px; background: {{me.fillAfter}}; color: #ffffff; font-size: 8.5px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{me.initials}}
                    <span style="position: absolute; right: -2px; bottom: -2px; width: 8px; height: 8px; border-radius: 50%; background: #30d158; border: 2px solid {{t.sidebar}}"></span>
                  </span>
                  {{me.name}}
                </button>
              </div>
            </sc-if>
          </div>
        </aside>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1004,"height":920}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const t = dark ? {
      board: '#0e0e10', canvas: '#141416', sidebar: '#1d1d20', sidebarClear: 'rgba(29,29,32,0)', bar: '#232326',
      text: '#f5f5f7', secondary: '#98989f', tertiary: '#8e8e94', border: 'rgba(255,255,255,0.1)',
      glass: 'rgba(52,52,56,0.55)', glassEdge: 'rgba(255,255,255,0.14)', glassHighlight: 'rgba(255,255,255,0.12)',
      shadow: 'rgba(0,0,0,0.45)', accent: '#4f9eff'
    } : {
      board: '#ececef', canvas: '#ffffff', sidebar: '#f3f3f5', sidebarClear: 'rgba(243,243,245,0)', bar: '#ebebee',
      text: '#1d1d1f', secondary: '#6a6a6f', tertiary: '#86868b', border: 'rgba(0,0,0,0.09)',
      glass: 'rgba(255,255,255,0.55)', glassEdge: 'rgba(0,0,0,0.08)', glassHighlight: 'rgba(255,255,255,0.9)',
      shadow: 'rgba(0,0,0,0.1)', accent: '#0065d6'
    };
    const unread = ['Incidents', 'Planning and Demos', 'Product'];
    const row = (name) => ({ name: name, weight: unread.includes(name) ? 600 : 400, color: unread.includes(name) ? t.text : t.secondary });
    const sections = [
      { title: 'Starred', rows: ['Agents', 'Team', 'Infra PR Reviews'].map(row) },
      { title: 'Channels', rows: ['Analytics', 'Backend', 'Billing', 'Data Platform', 'Design', 'Design Reviews', 'Docs',
        'Frontend', 'Hiring', 'Incidents', 'Infra', 'Legal', 'Marketing and Growth', 'Mobile', 'Office',
        'Planning and Demos', 'Platform and Tools', 'Product', 'QA', 'Random', 'Releases', 'Research'].map(row) }
    ];
    const variants = [
      { title: 'Было: обрезка', note: 'Строка режется пополам о полосу', clip: true, glass: false, fade: false, labelColor: t.text },
      { title: 'Сейчас: стеклянная плашка', note: 'Под стеклом каша, плашка тяжелее списка', clip: false, glass: true, fade: false, labelColor: t.text },
      { title: 'Предлагаю: мягкий край', note: 'Список растворяется, без формы и линии', clip: false, glass: false, fade: true, labelColor: t.accent }
    ];
    return {
      t: t, sections: sections, variants: variants,
      me: { name: 'Dmitry Ukhanov', initials: 'DU', fill: '#9a6d4c', fillAfter: 'linear-gradient(#8c7ed0, #7565bb)' }
    };
  }
}
</script>
</body>
</html>
